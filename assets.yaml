#     https://github.com/nobeyama-radio-observatory/nro-45m-if/blob/main/interviews/2026-11-18.md

- id: time-standard
  name: 標準時計：水素メーザー（水沢 VLBI 観測所の管理）
  kind: 時刻
  part_of: nro45m
  status: 運用中
  introduced: 前回の故障（十年ほど前か。仮説）を受けて、いまの水素メーザーを水沢 VLBI 観測所が持ち込んで運用している
  maintenance:
    by: 所内、水沢 VLBI 観測所
    condition: >-
      水沢 VLBI 観測所の管理で、保守を野辺山の装置システムグループが補助している。
      2023年度に故障して VLBI 観測の提供を止め、電源を修理して2025年の冬までに復旧し、VLBI 観測を提供している。
      2026年11月に原因不明の時刻のずれがあったが、その後は起きていない。ガス圧が下がっており、ずれと関係している可能性がある（仮説）
    effort: 小
  renewal: かなり古いが、更新の予定は立っていない
  owner_role: 水沢 VLBI 観測所（保守の補助は装置システムグループ）
  maintainers: 1
  sources:
    - 故障と修理：日本天文学会2025年秋季年会 https://www.asj.or.jp/nenkai/archive/2025b/pdf/V127b.pdf
    - 時刻のずれ：障害情報 Trouble ID 2026-4
    - VLBI 観測の提供の条件：有料望遠鏡時間の案内 https://www.nro.nao.ac.jp/projects/45m/charge-for-the-nobeyama-45-m-telescope-time/ 、プロポーザルの募集 https://www.nro.nao.ac.jp/projects/45m/proposals/calls/
    - 管理と保守の分担、修理の完了、ガス圧、更新の見込み、担い手の数、手間（回答者の見立て）：聞き取り2026-11-18 問5〜問7
  note: VLBI 観測にはこの水素メーザーが要る。VLBI のバックエンドは、水沢 VLBI 観測所が支援できる場合だけ提供される。HINOTORI-TZ の VLBI モードは調整中で使えない

- id: ts-rubidium
  name: 標準時計：ルビジウム発振器
  kind: 時刻
  part_of: nro45m
  status: 運用中
  maintenance: {by: 所内, condition: 未記入, effort: 小}
  renewal: 未記入
  owner_role: 装置システムグループ
  maintainers: 1
  sources:
    - 聞き取り2026-11-18 問5、問6
  note: ルビジウムでは単一鏡の観測はできるが、VLBI はできない。担い手の数と手間は、標準時計全体についての答えを当てはめたもの
